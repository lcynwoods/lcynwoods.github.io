    // Adding click event listener to the plot
    const plotElement = document.getElementById('volcano-plot');
    if (plotElement) {
      plotElement.on('plotly_click', openLinkOnClick);

      console.error('Plot element not found. Check if the ID is correct.');
    }
  });
